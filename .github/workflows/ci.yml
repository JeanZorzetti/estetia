name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking gate — mirrors what the EasyPanel Docker deploy actually does
  # (prisma generate + next build). `prisma migrate deploy` is intentionally
  # skipped: CI has no database; migrations run at deploy time.
  build:
    name: Build (deploy gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Dummy values — Prisma client and integrations are lazy-initialized;
      # the build must succeed without real credentials.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SESSION_SECRET: ci-only-session-secret-not-used-in-prod
      NEXTAUTH_SECRET: ci-only-nextauth-secret-not-used-in-prod
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx prisma generate --schema prisma/whatsapp.prisma
      - run: npx prisma validate
      - run: npx next build

  # Blocking since 2026-07-11: suite went 109 failing → 0 (644 passing).
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx prisma generate --schema prisma/whatsapp.prisma
      - run: npx vitest run --reporter=dot
        env:
          CI: true
